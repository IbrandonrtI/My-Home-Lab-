services:
  db:
    image: postgres:16-alpine
    container_name: nextcloud_db
    restart: always
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD}
    volumes:
      - /home/brandon/nextcloud/db:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: nextcloud_redis
    restart: always

  app:
    image: nextcloud:apache
    container_name: nextcloud
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8082:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NEXTCLOUD_DATA_DIR: /data
      NEXTCLOUD_TRUSTED_DOMAINS: "192.168.1.198 pc.griffin-luma.ts.net"
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: pc.griffin-luma.ts.net:1005
      OVERWRITECLIURL: https://pc.griffin-luma.ts.net:1005
      TRUSTED_PROXIES: "172.16.0.0/12 192.168.1.198"
      PHP_UPLOAD_LIMIT: 10G
    volumes:
      - /home/brandon/nextcloud/html:/var/www/html
      - /mnt/storage/nextcloud:/data

  cron:
    image: nextcloud:apache
    container_name: nextcloud_cron
    restart: always
    entrypoint: /cron.sh
    depends_on:
      - db
      - redis
    volumes:
      - /home/brandon/nextcloud/html:/var/www/html
      - /mnt/storage/nextcloud:/data

# ---------------------------------------------------------------
# Environment variables. Do NOT paste these into the YAML above.
# In Portainer, add them in the "Environment variables" box of the stack.
# ---------------------------------------------------------------
# NC_ADMIN_USER=your
# NC_ADMIN_PASSWORD=yours
# NC_DB_PASSWORD=yours

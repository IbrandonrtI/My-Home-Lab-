# Music downloader: Downtify saves songs into the music folder, and MeTube downloads videos from a link.
# Stack name in Portainer: music-downloader
# Ports:   Downtify 8000, MeTube 8185 (MeTube's own port inside the container is 8081, which FileBrowser already uses on this machine).
# Folders: /mnt/storage/music is where Downtify saves songs (Navidrome plays from the same folder).
#          /mnt/storage/videos is where MeTube saves videos.
# Images:  both follow "latest" on purpose. Downloaders break when YouTube or Spotify change, and their authors fix that by publishing a new
#          image, so a pinned old version would stop working. `sudo homelab-update check` shows when a newer one exists.
services:
  downtify:
    image: henriquesebastiao/downtify:latest
    container_name: downtify
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /mnt/storage/music:/downloads

  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    restart: unless-stopped
    ports:
      - "8185:8081"
    environment:
      PUID: "1000"
      PGID: "1000"
      DOWNLOAD_DIR: /downloads
    volumes:
      - /mnt/storage/videos:/downloads

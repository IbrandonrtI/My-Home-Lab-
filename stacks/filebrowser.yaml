# FileBrowser: a web file manager for the backups (view, download, edit).
# Stack name in Portainer: filebrowser. Keep the stack AND the service named "filebrowser":
# the container is then called filebrowser-filebrowser-1, which hdd-recover and the checks expect.
# Port:    8081 (web interface).
# Folders: one folder, Backup-Pool, with a folder for each backup drive inside it, named after the drive ("1 TB Samsung HDD").
#          Nothing else is shown. The line below shows the whole backup pool; on a new machine the installer replaces it with
#          one line per backup drive. Refresh after a drive change: sudo homelab-setup filebrowser
# Variables: none. The first admin password is random: docker logs filebrowser-filebrowser-1 | grep -i password
# Note: the FileBrowser project was archived in 2026 and gets no more updates; keep it off the internet.
services:
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - "/mnt/backup:/srv/Backup-Pool"
      - filebrowser_data:/database

volumes:
  filebrowser_data:

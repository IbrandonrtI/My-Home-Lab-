# FileBrowser: a web file manager for the boot drive's share and the main pool.
# Stack name in Portainer: filebrowser. Keep the stack AND the service named "filebrowser":
# the container is then called filebrowser-filebrowser-1, which hdd-recover and the checks expect.
# Port:    8081 (web interface).
# Folders: /home/your-username/750GB_HDD (boot drive) and /mnt/storage/filebrowser (main pool).
# Variables: none. The first admin password is random: docker logs filebrowser-filebrowser-1 | grep -i password
# Note: the FileBrowser project was archived in 2026 and gets no more updates; keep it off the internet.
services:
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - "/home/your-username/750GB_HDD:/srv/750GB_HDD"
      - "/mnt/storage/filebrowser:/srv/hdd"
      - filebrowser_data:/database

volumes:
  filebrowser_data:

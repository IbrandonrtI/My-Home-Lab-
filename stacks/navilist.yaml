services:
  navilist:
    image: ghcr.io/ofernander/navilist:v1.0.1
    container_name: navilist
    restart: unless-stopped
    labels:
      org.opencontainers.image.title: "naviList"
    ports:
      - "8200:3000"
    environment:
      TZ: "${TZ:-UTC}"
      PORT: "3000"
      DATA_DIR: "/app/data"
      NAVIDROME_URL: "${NAVILIST_NAVIDROME_URL}"
      NAVIDROME_USER: "${NAVILIST_NAVIDROME_USER}"
      NAVIDROME_PASSWORD: "${NAVILIST_NAVIDROME_PASSWORD}"
      LASTFM_API_KEY: "${NAVILIST_LASTFM_KEY:-}"
      LASTFM_USERNAME: "${NAVILIST_LASTFM_USER:-}"
      LISTENBRAINZ_TOKEN: "${NAVILIST_LB_TOKEN:-}"
      LISTENBRAINZ_USERNAME: "${NAVILIST_LB_USER:-}"
    volumes:
      - /home/your-username/navilist/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m

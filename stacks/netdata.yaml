# Netdata: live, second-by-second system metrics.
# Stack name in Portainer: netdata (the container is then called netdata-netdata-1).
# Port:    19999 (web interface).
# Variables: none.
# Security note: SYS_PTRACE and apparmor:unconfined are what Netdata's own Docker instructions ask for, so it can
# read process and network details. Keep the port off the internet.
services:
  netdata:
    image: netdata/netdata:stable
    restart: unless-stopped
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:

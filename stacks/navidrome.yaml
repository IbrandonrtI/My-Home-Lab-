services:
  navidrome:
    image: ghcr.io/navidrome/navidrome:0.64.2
    container_name: navidrome
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_DEFAULTTHEME: "Spotify-ish"
      ND_HTTPHEADERS_FRAMEOPTIONS: "ALLOWALL"
      ND_LASTFM_APIKEY: "${LASTFM_APIKEY:-}"
      ND_LASTFM_SECRET: "${LASTFM_SECRET:-}"
      ND_PLUGINS_ENABLED: "true"
      ND_PLUGINS_AUTORELOAD: "true"
      ND_AGENTS: "${NAVIDROME_AGENTS:-deezer,lastfm,listenbrainz}"
    volumes:
      - /home/your-username/navidrome:/data
      - /mnt/storage/music:/music:ro

# Navidrome: a music server. It plays the songs Downtify saved, on your phone or in a web page.
# Stack name in Portainer: navidrome
# Port:    4533 (web interface and the apps that speak the Subsonic protocol).
# Folders: /home/your-username/navidrome holds its database and settings (owned by the user with uid 1000).
#          The music folder is mounted read-only, so Navidrome can never change or delete a song.
#          The installer replaces the music folder below with the real one (the folder Downtify saves into).
# First login: the installer creates the login (your admin name and the shared admin password).
# Look:    the Spotify-ish theme is the default for a browser that has not chosen one (each person can still pick another in Navidrome's settings).
# Frame:   the frame header is relaxed so the dashboard can show the player in a card (see the Navidrome Player card of the dashboard).
#          Navidrome is only on your own network (and your Tailscale), so this is safe. To undo it, set it back to DENY and delete the player card.
# Last.fm: the two LASTFM variables hold your own free Last.fm key (sudo homelab-setup lastfm saves them). With them Navidrome suggests
#          similar songs and artists (Instant Mix); empty means Last.fm is not used.
services:
  navidrome:
    image: ghcr.io/navidrome/navidrome:0.61.0
    container_name: navidrome
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_DEFAULTTHEME: "Spotify-ish"
      ND_HTTPHEADERS_FRAMEOPTIONS: "ALLOWALL"
      ND_LASTFM_APIKEY: "${LASTFM_APIKEY:-}"
      ND_LASTFM_SECRET: "${LASTFM_SECRET:-}"
    volumes:
      - /home/your-username/navidrome:/data
      - /mnt/storage/music:/music:ro

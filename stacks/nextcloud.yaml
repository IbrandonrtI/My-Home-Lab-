# Nextcloud: personal cloud (files, calendar, contacts). Four containers: app, database, redis, cron.
# Stack name in Portainer: nextcloud
# Port:    8082 (web interface). The 1005 below must match the Tailscale Serve port you gave Nextcloud.
# Folders: /home/your-username/nextcloud/{db,html} (boot drive) and /mnt/storage/nextcloud (main pool, owned by uid 33).
# Variables: set them in Portainer BEFORE the first start; Nextcloud reads them only once. The list is at the end.
# The tag 35-apache keeps the major version fixed: Nextcloud cannot skip a major version, so update one at a time.
services:
  db:
    image: postgres:16-alpine
    container_name: nextcloud_db
    restart: always
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD}
    volumes:
      - /home/your-username/nextcloud/db:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: nextcloud_redis
    restart: always

  app:
    image: nextcloud:35-apache
    container_name: nextcloud
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8082:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NEXTCLOUD_DATA_DIR: /data
      NEXTCLOUD_TRUSTED_DOMAINS: "192.168.X.X pc.your-tailnet.ts.net"
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: pc.your-tailnet.ts.net:1005
      OVERWRITECLIURL: https://pc.your-tailnet.ts.net:1005
      TRUSTED_PROXIES: "172.16.0.0/12 192.168.X.X"
      PHP_UPLOAD_LIMIT: 10G
    volumes:
      - /home/your-username/nextcloud/html:/var/www/html
      - /mnt/storage/nextcloud:/data

  cron:
    image: nextcloud:35-apache
    container_name: nextcloud_cron
    restart: always
    entrypoint: /cron.sh
    depends_on:
      - db
      - redis
    volumes:
      - /home/your-username/nextcloud/html:/var/www/html
      - /mnt/storage/nextcloud:/data

# ---------------------------------------------------------------
# Environment variables. Do NOT paste these into the YAML above.
# In Portainer, add them in the "Environment variables" box of the stack.
# ---------------------------------------------------------------
# NC_ADMIN_USER=your-admin-name
# NC_ADMIN_PASSWORD=your-own-key   (letters and numbers only)
# NC_DB_PASSWORD=your-own-key      (letters and numbers only)

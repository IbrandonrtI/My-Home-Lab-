# Immich: photo and video backup with a phone app.
# Stack name in Portainer: immich
# Port:    2283 (web interface).
# Folders: photos in UPLOAD_LOCATION (the main pool), the database in DB_DATA_LOCATION (boot drive).
# Variables: set them in Portainer (Environment variables, advanced mode). The list is at the end of this file.
# Portainer reads stack.env from the variables you enter; for plain `docker compose up` create a stack.env file
# with the same lines next to this file.
# Immich changes often: compare this file with the docker-compose.yml of Immich's current release before you deploy.
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - stack.env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - stack.env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:

# ---------------------------------------------------------------
# Environment variables. Do NOT paste these into the YAML above.
# In Portainer, add them in the "Environment variables" box of the stack.
# ---------------------------------------------------------------
# UPLOAD_LOCATION=/mnt/storage/immich
# DB_DATA_LOCATION=/home/your-username/immich/postgres
# TZ=America/New_York
# IMMICH_VERSION=release
# DB_PASSWORD=your-own-key        (letters and numbers only)
# DB_USERNAME=postgres
# DB_DATABASE_NAME=immich

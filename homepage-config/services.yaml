# >>> homelab calendar >>>
# The Calendar at the bottom of the Home tab, under the service cards: US federal holidays (and Lincoln's Birthday and Election Day), a few more days
# (Valentine's Day, Lunar New Year, Diwali ...) and your own events. The calendar files are made by the command homelab-calendar
# (the installer runs it, and a weekly job keeps the years coming). Add your own events with:  homelab event add 2026-12-25 "Family dinner"
# and an online calendar (Google, school ...) with:  homelab calendar add NAME ADDRESS
# This block is brought up to date by the installer. To remove the calendar: delete everything between the two marker lines, then delete
# the Calendar entry from the layout: block of settings.yaml.
- Calendar:

    - This Month:
        id: cal-month
        icon: mdi-calendar-month
        widget:
          type: calendar
          view: monthly
          firstDayInWeek: sunday
          maxEvents: 8
          integrations:
            - type: ical
              name: Holidays
              url: http://192.168.X.X:3001/images/holidays.ics
              color: rose
            - type: ical
              name: Observances
              url: http://192.168.X.X:3001/images/observances.ics
              color: amber
            - type: ical
              name: My Events
              url: http://192.168.X.X:3001/images/events.ics
              color: sky
            - type: ical
              name: My Calendars
              url: http://192.168.X.X:3001/images/mycalendars.ics
              color: emerald

    - Coming Up:
        id: cal-agenda
        icon: mdi-calendar-clock
        widget:
          type: calendar
          view: agenda
          maxEvents: 8
          integrations:
            - type: ical
              name: Holidays
              url: http://192.168.X.X:3001/images/holidays.ics
              color: rose
            - type: ical
              name: Observances
              url: http://192.168.X.X:3001/images/observances.ics
              color: amber
            - type: ical
              name: My Events
              url: http://192.168.X.X:3001/images/events.ics
              color: sky
            - type: ical
              name: My Calendars
              url: http://192.168.X.X:3001/images/mycalendars.ics
              color: emerald

# <<< homelab calendar <<<

# >>> homelab customize >>>
# The CUSTOMIZE tab: the control panel (the program homelab-panel) as one big card, and the link editor of the Links tab. It changes the look, the layout, the cards and the links of this
# dashboard by pointing and clicking. It has its own password (set with:  homelab panel password) and is only reachable from your own devices (Tailscale).
# This block is brought up to date by the installer. To remove the tab: delete everything between the two marker lines, then delete the Customize
# entry from the layout: block of settings.yaml.
- Customize:

    - Control panel:
        id: customize-card
        icon: mdi-tune
        description: Look, layout, cards and links
        widget:
          type: iframe
          name: control-panel
          src: https://pc.your-tailnet.ts.net:1100/
          classes: h-96 sm:h-96 md:h-96 lg:h-96 xl:h-96 2xl:h-96
          allowScrolling: yes
          loadingStrategy: lazy


# The Links tab: a drop-down card above the bookmarks (closed until you open it) to add, change, move or remove bookmarks. It is part of the same panel.
- Edit Links:

    - Link editor:
        id: linkedit-card
        icon: mdi-pencil
        description: Add, change, move or remove bookmarks
        widget:
          type: iframe
          name: link-editor
          src: https://pc.your-tailnet.ts.net:1100/?only=links
          classes: h-96 sm:h-96 md:h-96 lg:h-96 xl:h-96 2xl:h-96
          allowScrolling: yes
          loadingStrategy: lazy

# The Links tab: a drop-down card with a terminal (a shell on this machine, in the browser). It goes through the control panel, so it needs the
# panel's login and is only reachable from your own devices (Tailscale).
- Terminal:

    - Web terminal:
        id: terminal-card
        icon: mdi-console
        description: A shell on this machine, in your browser
        widget:
          type: iframe
          name: web-terminal
          src: https://pc.your-tailnet.ts.net:1100/terminal/
          classes: h-96 sm:h-96 md:h-96 lg:h-96 xl:h-96 2xl:h-96
          allowScrolling: no
          loadingStrategy: lazy

# <<< homelab customize <<<

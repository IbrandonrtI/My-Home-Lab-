- Backup & updates:

    - Last backup:
        id: stat-backup
        icon: mdi-backup-restore
        description: When it ran and how it went
        widget:
          type: customapi
          url: http://192.168.X.X:3001/images/stats.json
          refreshInterval: 60000
          mappings:
            - field: last_backup.when
              label: Ran
            - field: last_backup.result
              label: Result
            - field: last_backup.size
              label: Size
            - field: last_backup.took
              label: Took

    - Containers & updates:

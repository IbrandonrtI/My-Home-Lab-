    #- Media & Entertainment

# >>> homelab stats >>>
# The STATS tab. Every number comes from one small file, stats.json, that the command homelab-stats rewrites every 15 minutes
# (sudo homelab-stats does it now). The Immich and Nextcloud numbers use the keys of the Immich and Nextcloud cards above.
# This block is brought up to date by the installer. To remove the tab: delete everything between the two marker lines, then
# delete the five STATS groups from the layout: block of settings.yaml.

- At a glance:

    - Library:
        id: stat-library
        icon: mdi-image-multiple
        description: Photos, videos and files
        widget:
          type: customapi
          url: http://192.168.X.X:3001/images/stats.json
          refreshInterval: 60000
          mappings:
            - field: glance.photos
              label: Photos
            - field: glance.videos
              label: Videos
            - field: glance.files
              label: Files

    - Storage used:
        id: stat-storage
        icon: mdi-harddisk
        description: How full the pools are
        widget:
          type: customapi
          url: http://192.168.X.X:3001/images/stats.json
          refreshInterval: 60000
          mappings:
            - field: glance.main_pct
              label: Main pool
            - field: glance.backup_pct
              label: Backup pool

    - Last backup:
        id: stat-lastbackup
        icon: mdi-backup-restore
        description: When it ran and how big it is
        widget:
          type: customapi
          url: http://192.168.X.X:3001/images/stats.json
          refreshInterval: 60000
          mappings:
            - field: glance.backup_when
              label: Ran
            - field: glance.backup_size
              label: Size

    - Containers:
        id: stat-containers
        icon: mdi-docker
        description: Running now and updates waiting
        widget:
          type: customapi
          url: http://192.168.X.X:3001/images/stats.json
          refreshInterval: 60000
          mappings:
            - field: glance.containers
              label: Running
            - field: glance.updates
              label: Updates

- Library totals:


- Network & DNS:

    - Tailscale:
        id: tailscale-card
        href: https://console.tailscale.com/admin/machines
        siteMonitor: https://console.tailscale.com/admin/machines
        icon: tailscale.svg
        description: Connected to Tailscale
        widget:
          type: tailscale
          deviceid: your-own-key
          key: your-own-key
          
    - AdGuard Home:
        id: adguard-card
        href: https://pc.your-tailnet.ts.net:1004
        siteMonitor: http://192.168.X.X:3000
        icon: adguard-home.svg
        description: DNS ad blocking
        widget:
          type: adguard
          url: http://192.168.X.X:3000
          username: Brandon
          password: your-own-key

    - Speedtest Tracker:
        id: speedtest-card
        href: https://pc.your-tailnet.ts.net:1007/admin
        siteMonitor: http://192.168.X.X:8088
        icon: speedtest-tracker.png
        description: Internet speed and connection history
        widget:
          type: speedtest
          url: http://192.168.X.X:8088
          version: 2
          key: your-own-key
          bitratePrecision: 2
          

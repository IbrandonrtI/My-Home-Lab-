# Homepage settings. Tested with Homepage 2.6.
# The background picture below is loaded from Unsplash every time the page opens. To keep the dashboard
# working offline, save a picture into the config folder's images/ folder and use  image: /images/yourfile.jpg
# (the homepage stack must mount that folder at /app/public/images, and Homepage must be restarted after a new picture)
title: Home Lab
headerStyle: boxedWidgets
theme: dark
color: slate
statusStyle: "dot"
useEqualHeights: true
maxGroupColumns: 4
disableCollapse: true
hideVersion: true
language: en
background:
  image: https://images.unsplash.com/photo-1778049005316-10cd95096f69?q=80&w=1740&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D
  blur: md
  saturate: 60
  brightness: 42
  opacity: 80

# Tabs and group icons. Each group is listed once; "tab:" puts it on a tab and "icon:" is the small picture next to its title.
# A group that is not listed here is shown on every tab. To rename a tab, change its name on every line that uses it.
# To go back to one page without tabs, delete everything from the line "layout:" down (the installer does not add it again).
layout:
  Network & DNS:
    tab: HOME
    icon: mdi-lan
  Monitoring & Management:
    tab: HOME
    icon: mdi-monitor-dashboard
  Files & Photos:
    tab: HOME
    icon: mdi-folder-multiple-image
  Media & Entertainment:
    tab: HOME
    icon: mdi-movie-open
  Entertainment:
    tab: LINKS
    icon: mdi-popcorn
  Online Shopping:
    tab: LINKS
    icon: mdi-cart
  Productivity:
    tab: LINKS
    icon: mdi-briefcase
  At a glance:
    tab: STATS
    icon: mdi-view-dashboard
    style: row
    columns: 4
  Library totals:
    tab: STATS
    icon: mdi-image-multiple
    style: row
    columns: 2
  Storage:
    tab: STATS
    icon: mdi-harddisk
    style: row
    columns: 2
  Backup & updates:
    tab: STATS
    icon: mdi-backup-restore
    style: row
    columns: 2
  Folder sizes:
    tab: STATS
    icon: mdi-folder-multiple
    style: row
    columns: 1

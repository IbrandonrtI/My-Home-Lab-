# Homepage settings. Tested with Homepage 2.6.
# The background picture below starts as a web address. The installer saves a copy in the images/ folder of this folder and
# changes the line to  image: /images/background.jpg  so the dashboard loads fast and works offline. To use another picture:
#   homelab theme background URL-or-FILE
# (the homepage stack mounts that folder at /app/public/images, and Homepage must be restarted after a new picture)
title: Home Lab
headerStyle: boxedWidgets
theme: dark
color: slate
statusStyle: "dot"
useEqualHeights: true
maxGroupColumns: 4
disableCollapse: true
hideVersion: true
language: en
background:
  image: https://images.unsplash.com/photo-1778049005316-10cd95096f69?q=80&w=1740&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D
  blur: md
  saturate: 60
  brightness: 42
  opacity: 80

# Quick Launch: start typing anywhere on the page to jump to a card, search the web or open an address.
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false
  showSearchSuggestions: true
  provider: google

# Tabs and group icons. Each group is listed once; "tab:" puts it on a tab and "icon:" is the small picture next to its title.
# A group that is not listed here is shown on every tab. To rename a tab, change its name on every line that uses it.
# To go back to one page without tabs, delete everything from the line "layout:" down (the installer does not add it again).
layout:
  Network & DNS:
    tab: Home
    icon: mdi-lan
  Monitoring & Management:
    tab: Home
    icon: mdi-monitor-dashboard
  Files & Photos:
    tab: Home
    icon: mdi-folder-multiple-image
  Media & Entertainment:
    tab: Home
    icon: mdi-movie-open
  Calendar:
    tab: Home
    icon: mdi-calendar-month
    style: row
    columns: 2
  At a Glance:
    tab: Stats
    icon: mdi-view-dashboard
    style: row
    columns: 4
  Music Library:
    tab: Stats
    icon: mdi-music
    style: row
    columns: 2
  Library Totals:
    tab: Stats
    icon: mdi-image-multiple
    style: row
    columns: 2
  Storage:
    tab: Stats
    icon: mdi-harddisk
    style: row
    columns: 3
  Backup & Updates:
    tab: Stats
    icon: mdi-backup-restore
    style: row
    columns: 2
  Folder Sizes:
    tab: Stats
    icon: mdi-folder-multiple
    style: row
    columns: 1
  Entertainment:
    tab: Links
    icon: mdi-popcorn
  Online Shopping:
    tab: Links
    icon: mdi-cart
  Productivity:
    tab: Links
    icon: mdi-briefcase

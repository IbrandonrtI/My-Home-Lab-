- resources:
    label: HomeLab
    cpu: true
    memory: true
    cputemp: true
    uptime: true

- resources:
    label: Main Pool
    disk: /mnt/storage
    expanded: true

- resources:
    label: Connect Backup Drive
    disk: /mnt/backup
    expanded: true

- resources:
    label: Network
    network: true

- datetime:
    text_size: md
    format:
      dateStyle: medium
      timeStyle: short
      hour12: true

- openmeteo:
    label: "New York"
    latitude: 40.7143
    longitude: -74.0060
    units: imperial
    cache: 5

- search:
    provider: google
    showSearchSuggestions: true
    target: _self

- resources:
    label: Server
    cpu: true
    memory: true
    cputemp: true
    uptime: true

# One pill for each pool. homelab-sample changes the label to "Connect Main Drive" / "Connect Backup Drive"
# while that pool is not mounted, and back again when it is. The expanded view shows free space and the total.
- resources:
    label: Main pool
    disk: /mnt/storage
    expanded: true

- resources:
    label: Backup pool
    disk: /mnt/backup
    expanded: true

- resources:
    label: Network
    network: true

- datetime:
    text_size: md
    format:
      dateStyle: short
      timeStyle: short
      hour12: true

- openmeteo:
    label: City
    latitude: 40.7128
    longitude: -74.0060
    units: imperial
    cache: 5

- search:
    provider: google
    showSearchSuggestions: true
    target: _self

- resources:
    label: Lenovo 
    cpu: true
    memory: true
    cputemp: true
    uptime: true

- resources:
    label: Drives
    disk:
      - /
      - /mnt/storage
    network: true


- datetime:
    text_size: md
    format:
      dateStyle: short
      timeStyle: short
      hour12: true

- openmeteo:
    
    label: city
    latitude: your-own
    longitude: your-own
    units: imperial
    cache: 5

- search:
    provider: google
    showSearchSuggestions: true
    target: _self
